<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>监督详情弹窗 · 结构方案预览</title>
		<!-- 真实控制台样式，保证字号、密度、颜色与线上完全一致 -->
		<link rel="stylesheet" href="../webui/src/style.css" />
		<style>
			/* ---- 预览外壳（不属于产品） ---- */
			body {
				margin: 0;
				background: #eef0f4;
			}

			.mk-bar {
				position: sticky;
				top: 0;
				z-index: 100;
				display: flex;
				align-items: center;
				gap: 8px;
				padding: 10px 16px;
				border-bottom: 1px solid #e5e6eb;
				background: #fff;
				box-shadow: 0 1px 4px #0000000f;
			}

			.mk-bar b {
				margin-right: 6px;
				font-size: 13px;
				font-weight: 600;
			}

			.mk-tab {
				height: 28px;
				padding: 0 12px;
				border: 1px solid #dcdfe6;
				border-radius: 6px;
				background: #fff;
				color: #606266;
				font-size: 12px;
				cursor: pointer;
			}

			.mk-tab.on {
				border-color: #0960bd;
				background: #0960bd;
				color: #fff;
			}

			.mk-note {
				margin-left: auto;
				color: #909399;
				font-size: 12px;
			}

			.mk-label {
				width: 1440px;
				margin: 18px auto 8px;
				color: #606266;
				font-size: 12px;
			}

			.mk-stage {
				display: flex;
				width: 1440px;
				height: 800px;
				flex-direction: column;
				margin: 0 auto;
				border: 1px solid #dcdfe6;
				border-radius: 4px;
				background: #fafafa;
				overflow: hidden;
			}

			/* ---- 弹窗内容骨架（各方案共用） ---- */
			.sva-modal {
				height: auto;
				max-height: min(84vh, 780px);
			}

			.sva-meta-inline {
				display: flex;
				flex-wrap: wrap;
				align-items: baseline;
				gap: 3px 16px;
				color: var(--dim);
				font-size: 11.5px;
			}

			.sva-meta-inline b {
				color: var(--text-bright);
				font-weight: 600;
			}

			.sva-modal-cols {
				display: grid;
				grid-template-columns: 1.4fr 1fr 1fr;
				gap: 18px;
				margin-top: 14px;
			}

			.sva-section {
				margin: 0;
				min-width: 0;
			}

			.sva-section > h4 {
				margin: 0 0 6px;
				color: var(--dim);
				font-size: 11px;
				font-weight: 600;
			}

			.sva-intent {
				margin: 10px 0 0;
				padding: 8px 10px;
				border-left: 2px solid var(--accent-border);
				background: var(--raised);
				color: var(--text);
				font-size: 11.5px;
				line-height: 1.55;
			}

			.sva-note {
				margin: 7px 0 0;
				padding: 6px 8px;
				border-radius: var(--radius);
				background: var(--raised);
				color: var(--dim);
				font-size: 11px;
				line-height: 1.5;
			}

			/* 弹窗里的滚动容器统一：列内滚动 */
			.col-scroll {
				min-height: 0;
				overflow: auto;
			}

			/* ---- 方案 1：三栏各自滚动 ---- */
			.v1 .modal {
				height: min(78vh, 760px);
			}

			.v1 .modal__body {
				overflow: hidden;
			}

			.v1 .sva-modal-cols {
				flex: 1;
				min-height: 0;
				margin-top: 14px;
			}

			.v1 .sva-section {
				display: flex;
				flex-direction: column;
				min-height: 0;
			}

			.v1 .sva-section > h4 {
				flex: none;
			}

			/* ---- 方案 2：标签页 ---- */
			.v2 .modal {
				width: min(820px, calc(100vw - 64px));
				height: min(74vh, 720px);
			}

			.v2 .modal__body {
				overflow: hidden;
			}

			.v2 .mk-tabs {
				display: flex;
				flex: none;
				gap: 4px;
				margin: 0 0 12px;
				border-bottom: 1px solid var(--border);
			}

			.v2 .mk-tabs button {
				height: 30px;
				padding: 0 12px;
				border: 0;
				border-bottom: 2px solid transparent;
				border-radius: 0;
				background: transparent;
				color: var(--dim);
				font-size: 12.5px;
			}

			.v2 .mk-tabs button.on {
				border-bottom-color: var(--accent);
				color: var(--accent);
				font-weight: 500;
			}

			.v2 .mk-tabs .cnt {
				margin-left: 6px;
				color: var(--faint);
				font-family: var(--mono);
				font-size: 11px;
			}

			.v2 .mk-panel {
				flex: 1;
				min-height: 0;
				overflow: auto;
			}

			/* ---- 方案 3：主从两栏 ---- */
			.v3 .modal {
				height: min(78vh, 760px);
			}

			.v3 .modal__body {
				overflow: hidden;
			}

			.v3 .mk-split {
				display: grid;
				flex: 1;
				min-height: 0;
				grid-template-columns: 300px minmax(0, 1fr);
				gap: 16px;
			}

			.v3 .mk-split > .list {
				overflow: auto;
				padding-right: 4px;
			}

			.v3 .mk-split > .detail {
				overflow: auto;
			}

			.v3 .ep-item {
				display: block;
				width: 100%;
				margin-bottom: 4px;
				padding: 7px 8px;
				border: 1px solid var(--border);
				border-radius: var(--radius);
				background: var(--card);
				text-align: left;
			}

			.v3 .ep-item.on {
				border-color: var(--accent);
				background: var(--accent-dim);
			}

			.v3 .ep-item .l1 {
				display: flex;
				align-items: center;
				gap: 6px;
				color: var(--faint);
				font-size: 10px;
			}

			.v3 .ep-item .l2 {
				margin-top: 2px;
				color: var(--text);
				font-size: 11px;
				line-height: 1.4;
			}

			/* ---- 方案 4：上下两段 ---- */
			.v4 .modal {
				height: min(80vh, 780px);
			}

			.v4 .modal__body {
				overflow: hidden;
			}

			.v4 .mk-top {
				display: grid;
				flex: 1 1 auto;
				min-height: 0;
				grid-template-columns: 1.4fr 1fr;
				gap: 18px;
			}

			.v4 .mk-top > .col {
				display: flex;
				flex-direction: column;
				min-height: 0;
			}

			.v4 .mk-top > .col > .sva-section {
				display: flex;
				flex: 1;
				flex-direction: column;
				min-height: 0;
			}

			.v4 .mk-top > .col > .sva-section > .col-scroll {
				flex: 1;
				min-height: 0;
			}

			.v4 .mk-bottom {
				flex: none;
				height: 190px;
				margin-top: 14px;
				padding-top: 12px;
				overflow: auto;
				border-top: 1px solid var(--border);
			}
		</style>
	</head>
	<body>
		<div class="mk-bar">
			<b>监督详情弹窗 · 结构方案</b>
			<button type="button" class="mk-tab" data-v="v0">0 现状（整体滚动）</button>
			<button type="button" class="mk-tab on" data-v="v1">1 三栏各自滚动 + 翻页</button>
			<button type="button" class="mk-tab" data-v="v2">2 标签页</button>
			<button type="button" class="mk-tab" data-v="v3">3 主从两栏</button>
			<button type="button" class="mk-tab" data-v="v4">4 上下两段</button>
			<span class="mk-note">长内容样本：8 个 Episode · 5 条建议 · 24 行日志 · <b>已采用方案 1</b></span>
		</div>

		<div class="mk-label" id="mk-label"></div>
		<div class="mk-stage" id="mk-stage"></div>

		<script>
			const LABELS = {
				v0: "方案 0 · 现状——三栏并排，但整个弹窗一起滚：Episode 一长，日志被顶出视野，得滚回去找",
				v1: "方案 1 · 三栏各自滚动 + 每栏翻页（已采用）——弹窗本身不滚，指标条与列标题常驻；每一栏滚自己的，同时每栏自带翻页器，Episode / 建议 / 日志按各自的条数分页",
				v2: "方案 2 · 标签页——Episode / 建议 / 日志 各自一页签（带计数），单栏滚动，最省眼；代价是看不到别的栏",
				v3: "方案 3 · 主从两栏——左边 Episode 列表可点选，右边看选中那轮的详情、建议与日志；滚动量最小",
				v4: "方案 4 · 上下两段——上段 Episode | 建议 并排各自滚，下段一条通栏日志；日志不再是小方块",
			};

			// 长内容样本：真实的监督记录会长这样
			const EPISODES = [
				{ at: "11/15 06:13", progress: "停滞", cls: "warn", phase: "漏洞验证", trigger: "批量触发", intent: "SQLi 无差异：注入 payload 后响应长度一致，未复现差异", outcomes: ["注入 payload 后响应长度与基线一致，未复现差异", "布尔条件 true/false 返回相同", "报错注入返回 200 而非 500"], dead: "/api/user?id SQLi", next: "转向 IDOR 对照请求" },
				{ at: "11/15 06:15", progress: "有进展", cls: "ok", phase: "漏洞验证", trigger: "没有新证据", intent: "同一注入点重复 3 次，准备换对照变量", outcomes: ["换用单引号闭合变体，响应长度仍一致"], dead: "", next: "构造正常账号对照" },
				{ at: "11/15 06:18", progress: "循环", cls: "bad", phase: "漏洞验证", trigger: "重复调用", intent: "第 5 次重复同一 payload，判定为循环", outcomes: ["同一调用指纹出现 5 次", "没有产生新证据"], dead: "布尔盲注 / 报错注入 / 时间盲注三条线", next: "暂停该方向，先做资产测绘" },
				{ at: "11/15 06:22", progress: "有进展", cls: "ok", phase: "利用", trigger: "运行结算", intent: "找到 /api/order/detail?id 可越权读取他人订单", outcomes: ["以 B 账号请求 A 账号订单返回 200 且带出金额字段", "同一请求去掉 cookie 后 401"], dead: "", next: "补 2 个样本确认影响面" },
				{ at: "11/15 06:26", progress: "有进展", cls: "ok", phase: "利用", trigger: "没有新证据", intent: "扩大样本：连续 3 个订单号均可越权读取", outcomes: ["订单 10021 / 10022 / 10023 均返回他人数据"], dead: "", next: "提交漏洞并附 3 组对照" },
				{ at: "11/15 06:31", progress: "停滞", cls: "warn", phase: "利用", trigger: "连续报错", intent: "尝试写接口时被 403 拦截，疑似有 WAF", outcomes: ["PUT /api/order 返回 403", "同一路径 GET 正常"], dead: "直接写订单接口", next: "换思路：只做只读取证" },
				{ at: "11/15 06:38", progress: "有进展", cls: "ok", phase: "利用", trigger: "批量触发", intent: "确认漏洞不影响列表接口，只影响详情接口", outcomes: ["列表接口对 200 个订单号做了越权检查，均无越权"], dead: "列表批量越权", next: "整理影响范围" },
				{ at: "11/15 06:44", progress: "有进展", cls: "ok", phase: "报告", trigger: "运行结算", intent: "证据齐备，整理成待提交条目", outcomes: ["3 组对照请求 + 响应已存证"], dead: "", next: "提交漏洞中枢" },
			];

			const ADVICE = [
				{ at: "11/15 06:13", delivery: "确认", status: "pending", text: "停止 SQLi 方向，转向 IDOR 对照请求；同一注入点已重复 3 次没有新证据。" },
				{ at: "11/15 06:15", delivery: "自动", status: "sent", text: "用不同权限账号重放同一请求，确认响应字段差异。" },
				{ at: "11/15 06:18", delivery: "自动", status: "sent", text: "检测到调用指纹重复 5 次，先做资产测绘再回到注入方向。" },
				{ at: "11/15 06:31", delivery: "确认", status: "pending", text: "写接口被 403 拦截，疑似 WAF；建议只做只读取证，不要尝试绕过。" },
				{ at: "11/15 06:38", delivery: "确认", status: "ignored", text: "建议扩大订单号枚举范围到 500 个。" },
			];

			const LOGS = [
				"监督已开启：观察模式",
				"episode 开始：批量触发",
				"读取调用摘要 20 条",
				"episode 完成：停滞",
				"episode 开始：没有新证据",
				"episode 完成：有进展",
				"监督模型超时，改用上次结论",
				"episode 开始：重复调用",
				"episode 完成：循环",
				"建议已发送（自动）",
				"episode 开始：运行结算",
				"episode 完成：有进展",
				"episode 开始：没有新证据",
				"episode 完成：有进展",
				"episode 开始：连续报错",
				"episode 完成：停滞",
				"episode 开始：批量触发",
				"episode 完成：有进展",
				"建议已发送（自动）",
				"episode 开始：运行结算",
				"episode 完成：有进展",
				"建议待确认，未发送",
				"监督模型返回：漏洞验证 → 利用",
				"episode 完成：有进展",
			];

			const META_INLINE = `
				<div class="sva-meta-inline">
					<span>阶段 <b>利用</b></span>
					<span>进度 <b>有进展</b></span>
					<span>工具调用 <b>42</b></span>
					<span>Episode <b>8</b></span>
					<span>tokens <b>12.4k</b></span>
					<span>模式 <b>观察</b></span>
					<span>策略 <b>稳健交付</b></span>
				</div>`;

			function episodeBlock(ep) {
				return `
					<div class="sva-episode">
						<div class="sva-episode-head">
							<span class="sva-mono">${ep.at}</span>
							<span class="sva-pill ${ep.cls}">${ep.progress}</span>
							<span class="sva-episode-phase">${ep.phase}</span>
							<span class="sva-episode-trigger">${ep.trigger}</span>
						</div>
						<p>${ep.intent}</p>
						<ul>${ep.outcomes.map((o) => `<li>${o}</li>`).join("")}</ul>
						${ep.dead ? `<p class="sva-dead">已排除：${ep.dead}</p>` : ""}
						${ep.next ? `<p class="sva-next">下一步：${ep.next}</p>` : ""}
					</div>`;
			}

			function adviceBlock(a) {
				return `
					<div class="sva-advice ${a.status}">
						<div class="sva-advice-head">
							<span class="sva-mono">${a.at}</span>
							<span>${a.delivery}</span>
							<span class="sva-advice-status">${a.status === "sent" ? "已发送" : a.status === "ignored" ? "已忽略" : "待确认"}</span>
						</div>
						<pre>${a.text}</pre>
					</div>`;
			}

			function columnPager(page, pages) {
				if (pages <= 1) return "";
				return `
					<div class="sva-col-pager">
						<button type="button" disabled>‹</button>
						<span>${page} / ${pages}</span>
						<button type="button">›</button>
					</div>`;
			}

			function logBlock() {
				return `
					<div class="sva-log" style="max-height:none;border:0;padding:0;background:transparent">
						${LOGS.map((l, i) => `<div class="sv-log__line ${l.includes("超时") || l.includes("未发送") ? "bad" : ""}"><span>11/15 0${6 + Math.floor(i / 8)}:${String(10 + i).padStart(2, "0")}</span><span>${l}</span></div>`).join("")}
					</div>`;
			}

			function modalHead() {
				return `
					<div class="ws-panel__head">
						<div class="ws-panel__title">
							支付接口复测
							<span class="ws-panel__sub">支付网关 · 观察 · 稳健交付</span>
						</div>
						<div class="ws-panel__actions">
							<button type="button" class="primary">打开会话</button>
							<button type="button" class="ghost small">✕</button>
						</div>
					</div>`;
			}

			function table() {
				const rows = [
					["监督中", "观察", "支付接口复测", "支付网关", "漏洞验证", "停滞", "warn", "稳健交付", "42 / 8", "1", "12.4k"],
					["监督中", "介入", "订单中心越权复现与验证", "支付网关", "利用", "有进展", "ok", "漏洞验证", "128 / 7", "—", "50.8k"],
					["已停止", "观察", "后台管理系统指纹识别", "内部资产测绘", "侦察", "循环", "bad", "稳健交付", "9 / 1", "3", "2.4k"],
					["错误", "介入", "小程序登录态重放", "内部资产测绘", "枚举", "未判断", "", "低噪声自建策略", "3 / 0", "—", "800"],
				];
				return `
					<div class="sva-table-scroll">
						<table class="sva-table">
							<thead><tr><th>状态</th><th>会话 / 项目</th><th>阶段</th><th>进度</th><th>策略</th><th>调用 / Episode</th><th>建议</th><th>tokens</th><th>最近更新</th></tr></thead>
							<tbody>
								${rows
									.map(
										(r, i) => `<tr class="${i === 0 ? "selected" : ""}">
										<td><span class="sva-status-cell"><span class="sva-status"><span class="sva-dot ${i === 0 ? "ok" : ""}"></span>${r[0]}</span><span class="sva-status-mode">${r[1]}</span></span></td>
										<td><div class="sva-session"><b>${r[2]}</b><span>${r[3]}</span></div></td>
										<td>${r[4]}</td>
										<td><span class="sva-pill ${r[6]}">${r[5]}</span></td>
										<td><span class="sva-pill">${r[7]}</span></td>
										<td class="sva-mono">${r[8]}</td>
										<td>${r[9] === "—" ? '<span class="sva-faint">—</span>' : `<span class="sva-advice-count">${r[9]}</span>`}</td>
										<td class="sva-mono">${r[10]}</td>
										<td class="sva-time">11/15 06:44</td>
									</tr>`,
									)
									.join("")}
							</tbody>
						</table>
					</div>`;
			}

			function page(inner, variant) {
				return `
					<div class="page-card sva-page">
						<div class="ws-panel__head">
							<div class="ws-panel__title">监督<span class="ws-panel__sub">全部对话的监督审计 · 只读 · 共 4 个会话</span></div>
							<button type="button" class="ghost">刷新</button>
						</div>
						<div class="ws-panel__body sva-body">
							<div class="sva-content">
								<div class="gate-summary sva-summary">
									<span>监督会话 <b>4</b></span><span class="ok">有进展 <b>1</b></span>
									<span class="warn">停滞 <b>1</b></span><span class="bad">循环 <b>1</b></span>
									<span>已停止 <b>1</b></span><span class="warn">待确认建议 <b>1</b></span>
								</div>
								${table()}
							</div>
						</div>
					</div>
					<div class="modal-backdrop ${variant}">
						<div class="modal modal--wide sva-modal">
							${modalHead()}
							<div class="modal__body">${inner}</div>
						</div>
					</div>`;
			}

			const VARIANTS = {
				// 0 现状：三栏并排，整个弹窗一起滚
				v0: () =>
					page(
						`${META_INLINE}
						<p class="sva-intent">重复测试 SQLi；已确认 /api/order/detail?id 存在越权读取</p>
						<div class="sva-modal-cols">
							<div class="sva-section">
								<h4>Episode</h4>
								${EPISODES.map(episodeBlock).join("")}
							</div>
							<div class="sva-section">
								<h4>建议</h4>
								${ADVICE.map(adviceBlock).join("")}
							</div>
							<div class="sva-section">
								<h4>日志</h4>
								${logBlock()}
							</div>
						</div>`,
						"v0",
					),

				// 1 三栏各自滚动 + 每栏翻页（已采用）
				v1: () =>
					page(
						`${META_INLINE}
						<p class="sva-intent">重复测试 SQLi；已确认 /api/order/detail?id 存在越权读取</p>
						<div class="sva-modal-cols">
							<div class="sva-section">
								<h4>Episode <span class="sva-count">8</span></h4>
								<div class="sva-col-scroll">${EPISODES.slice(0, 3).map(episodeBlock).join("")}</div>
								${columnPager(1, 3)}
							</div>
							<div class="sva-section">
								<h4>建议 <span class="sva-count">5</span></h4>
								<div class="sva-col-scroll">${ADVICE.slice(0, 3).map(adviceBlock).join("")}</div>
								${columnPager(1, 2)}
							</div>
							<div class="sva-section">
								<h4>日志 <span class="sva-count">24</span></h4>
								<div class="sva-col-scroll">${logBlock()}</div>
								${columnPager(1, 2)}
							</div>
						</div>`,
						"v1",
					),

				// 2 标签页
				v2: () =>
					page(
						`${META_INLINE}
						<p class="sva-intent">重复测试 SQLi；已确认 /api/order/detail?id 存在越权读取</p>
						<div class="mk-tabs">
							<button type="button" class="on">Episode<span class="cnt">8</span></button>
							<button type="button">建议<span class="cnt">5</span></button>
							<button type="button">日志<span class="cnt">24</span></button>
						</div>
						<div class="mk-panel">${EPISODES.map(episodeBlock).join("")}</div>`,
						"v2",
					),

				// 3 主从两栏
				v3: () =>
					page(
						`${META_INLINE}
						<div class="mk-split">
							<div class="list">
								${EPISODES.map(
									(ep, i) => `<button type="button" class="ep-item ${i === 0 ? "on" : ""}">
										<span class="l1"><span class="sva-mono">${ep.at}</span><span class="sva-pill ${ep.cls}">${ep.progress}</span></span>
										<span class="l2">${ep.intent}</span>
									</button>`,
								).join("")}
							</div>
							<div class="detail">
								<div class="sva-episode">
									<div class="sva-episode-head">
										<span class="sva-mono">${EPISODES[0].at}</span>
										<span class="sva-pill ${EPISODES[0].cls}">${EPISODES[0].progress}</span>
										<span class="sva-episode-phase">${EPISODES[0].phase}</span>
										<span class="sva-episode-trigger">${EPISODES[0].trigger}</span>
									</div>
									<p>${EPISODES[0].intent}</p>
									<ul>${EPISODES[0].outcomes.map((o) => `<li>${o}</li>`).join("")}</ul>
									${EPISODES[0].dead ? `<p class="sva-dead">已排除：${EPISODES[0].dead}</p>` : ""}
									${EPISODES[0].next ? `<p class="sva-next">下一步：${EPISODES[0].next}</p>` : ""}
								</div>
								<div class="sva-section" style="margin-top:16px">
									<h4>本轮建议</h4>
									${adviceBlock(ADVICE[0])}
									${adviceBlock(ADVICE[1])}
								</div>
								<div class="sva-section" style="margin-top:16px">
									<h4>日志</h4>
									${logBlock()}
								</div>
							</div>
						</div>`,
						"v3",
					),

				// 4 上下两段
				v4: () =>
					page(
						`${META_INLINE}
						<p class="sva-intent">重复测试 SQLi；已确认 /api/order/detail?id 存在越权读取</p>
						<div class="mk-top">
							<div class="col">
								<div class="sva-section">
									<h4>Episode</h4>
									<div class="col-scroll">${EPISODES.map(episodeBlock).join("")}</div>
								</div>
							</div>
							<div class="col">
								<div class="sva-section">
									<h4>建议</h4>
									<div class="col-scroll">${ADVICE.map(adviceBlock).join("")}</div>
								</div>
							</div>
						</div>
						<div class="mk-bottom">
							<div class="sva-section">
								<h4>日志</h4>
								${logBlock()}
							</div>
						</div>`,
						"v4",
					),
			};

			const stage = document.getElementById("mk-stage");
			const label = document.getElementById("mk-label");
			const tabs = [...document.querySelectorAll(".mk-tab")];

			/**
			 * 静态截图看不出滚动差异，所以每个方案都预滚到中部：
			 * 现状是整个弹窗一起滚（日志被带出视野），其余方案是各滚各的。
			 */
			function simulateScroll(id) {
				const set = (selector, top) => {
					const node = stage.querySelector(selector);
					if (node) node.scrollTop = top;
				};
				if (id === "v0") set(".v0 .modal__body", 420);
				if (id === "v1") set(".v1 .col-scroll", 420);
				if (id === "v2") set(".v2 .mk-panel", 420);
				if (id === "v3") {
					set(".v3 .list", 160);
					set(".v3 .detail", 0);
				}
				if (id === "v4") set(".v4 .col-scroll", 420);
			}

			function show(id) {
				if (!VARIANTS[id]) id = "v0";
				stage.innerHTML = VARIANTS[id]();
				label.innerHTML = LABELS[id];
				for (const tab of tabs) tab.classList.toggle("on", tab.dataset.v === id);
				simulateScroll(id);
			}

			for (const tab of tabs) {
				tab.addEventListener("click", () => {
					location.hash = tab.dataset.v;
					show(tab.dataset.v);
				});
			}
			window.addEventListener("hashchange", () => show(location.hash.slice(1)));
			show(location.hash.slice(1) || "v0");
		</script>
	</body>
</html>
