<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>登录页左侧动画方案</title>
<style>
	:root {
		--bg: #0b0f14;
		--panel: #0d1218;
		--line: #1d2733;
		--text: #e8eaed;
		--dim: #8b98a5;
		--accent: #1668dc;
		--amber: #e6a23c;
		--red: #e34d59;
		--mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
		--sans: -apple-system, "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif;
	}
	* { box-sizing: border-box; }
	body { margin: 0; background: #05070a; color: var(--text); font: 13px/1.6 var(--sans); }

	.switcher {
		position: fixed; top: 0; left: 0; right: 0; z-index: 50;
		display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
		padding: 10px 16px;
		background: #0a0d11ee; border-bottom: 1px solid var(--line);
		backdrop-filter: blur(6px);
	}
	.switcher button {
		padding: 5px 12px; border: 1px solid var(--line); border-radius: 6px;
		background: transparent; color: var(--dim); font-size: 12.5px; cursor: pointer; font-family: var(--sans);
	}
	.switcher button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
	.switcher .desc { margin-left: auto; color: var(--dim); font-size: 12px; max-width: 560px; text-align: right; }

	.stage { display: grid; grid-template-columns: minmax(0, 1fr) minmax(400px, 520px); height: 100vh; padding-top: 53px; }
	.visual { position: relative; overflow: hidden; background: var(--bg); }
	.visual > canvas, .visual > .layer { position: absolute; inset: 0; }

	/* The brand block every variant shares. */
	.brand { position: absolute; left: 52px; bottom: 48px; z-index: 10; display: flex; flex-direction: column; gap: 6px; }
	.brand-row { display: flex; align-items: center; gap: 14px; }
	.brand-badge {
		display: inline-flex; align-items: center; justify-content: center;
		width: 44px; height: 44px; border-radius: 10px;
		background: var(--accent); color: #fff; font-size: 17px; font-weight: 700;
	}
	.brand-name { font-size: 22px; font-weight: 600; color: #fff; }
	.tagline { color: var(--dim); font-size: 13px; }

	.panel {
		display: flex; align-items: center; justify-content: center;
		background: var(--panel); border-left: 1px solid var(--line);
	}
	.form { width: min(340px, 100%); display: flex; flex-direction: column; gap: 14px; }
	.form h1 { margin: 0; font-size: 21px; color: #fff; }
	.form .hint { margin: -6px 0 4px; color: var(--dim); font-size: 12.5px; }
	.form .field { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; color: #aab4bf; }
	.form .field input {
		height: 40px; padding: 0 12px; border: 1px solid #24313f; border-radius: 8px;
		background: #0f161e; color: var(--text); font-size: 14px;
	}
	.form .submit {
		height: 42px; border: none; border-radius: 8px;
		background: #f2f3f5; color: #101418; font-size: 14px; font-weight: 600;
	}

	/* ---- F 极光呼吸（纯 CSS 层） ---- */
	#layer-aurora { display: none; }
	#layer-aurora .blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.5; }
	#layer-aurora .b1 { width: 520px; height: 520px; left: -120px; top: -80px; background: #1668dc55; animation: drift1 14s ease-in-out infinite alternate; }
	#layer-aurora .b2 { width: 460px; height: 460px; right: -100px; top: 30%; background: #0e7a4a44; animation: drift2 18s ease-in-out infinite alternate; }
	#layer-aurora .b3 { width: 380px; height: 380px; left: 30%; bottom: -140px; background: #6a3cd844; animation: drift3 16s ease-in-out infinite alternate; }
	@keyframes drift1 { to { transform: translate(90px, 60px) scale(1.15); } }
	@keyframes drift2 { to { transform: translate(-70px, -50px) scale(0.9); } }
	@keyframes drift3 { to { transform: translate(60px, -70px) scale(1.1); } }

	/* ---- G 终端日志（打字） ---- */
	#layer-term { display: none; padding: 44px 48px; font-family: var(--mono); font-size: 12.5px; line-height: 1.9; color: #58d68d; text-shadow: 0 0 6px #58d68d33; }
	#layer-term .ln { white-space: pre-wrap; word-break: break-all; }
	#layer-term .ok { color: #58d68d; }
	#layer-term .warn { color: var(--amber); }
	#layer-term .dim { color: #5c6873; }
	#layer-term .caret { display: inline-block; width: 8px; height: 15px; background: #58d68d; vertical-align: -2px; animation: blink 1s step-end infinite; }
	@keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
	<div class="switcher" id="switcher">
		<button data-v="tiles" class="on">B 网格脉冲</button>
		<button data-v="matrix">A 字符雨</button>
		<button data-v="particles">C 粒子网络</button>
		<button data-v="radar">D 雷达扫描</button>
		<button data-v="term">G 终端日志</button>
		<button data-v="aurora">F 极光呼吸</button>
		<span class="desc" id="desc"></span>
	</div>

	<div class="stage">
		<aside class="visual">
			<canvas id="fx"></canvas>
			<div class="layer" id="layer-aurora">
				<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
			</div>
			<div class="layer" id="layer-term"></div>
			<div class="brand">
				<div class="brand-row">
					<span class="brand-badge">ZG</span>
					<span class="brand-name">Full Chain Sentinel</span>
				</div>
				<div class="tagline">授权渗透测试工作台</div>
			</div>
		</aside>
		<main class="panel">
			<form class="form" onsubmit="return false">
				<h1>登录到工作台</h1>
				<div class="hint">输入你的凭据以继续。</div>
				<label class="field">用户名<input /></label>
				<label class="field">密码<input type="password" /></label>
				<button class="submit">登录</button>
			</form>
		</main>
	</div>

<script>
const canvas = document.getElementById("fx");
const ctx = canvas.getContext("2d");
const visual = document.querySelector(".visual");
const raf = 0;
let current = "tiles";

function sizeCanvas() {
	const r = visual.getBoundingClientRect();
	canvas.width = r.width * devicePixelRatio;
	canvas.height = r.height * devicePixelRatio;
	ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
	return { w: r.width, h: r.height };
}

/* ---------- B 网格脉冲：瓦片随机点亮后衰减，偶尔琥珀/红（参考图气质） ---------- */
function tilesFactory() {
	const { w, h } = sizeCanvas();
	const CELL = 34;
	const cols = Math.ceil(w / CELL);
	const rows = Math.ceil(h / CELL);
	const heat = new Float32Array(cols * rows);
	const tint = new Uint8Array(cols * rows);
	const glyphs = "0123456789ABCDEF";
	return {
		step() {
			ctx.clearRect(0, 0, w, h);
			// Spawn a few warm tiles per frame.
			for (let n = 0; n < 3; n += 1) {
				const i = Math.floor(Math.random() * heat.length);
				heat[i] = 0.6 + Math.random() * 0.4;
				tint[i] = Math.random() < 0.08 ? 2 : Math.random() < 0.25 ? 1 : 0;
			}
			ctx.font = "11px " + getComputedStyle(document.body).fontFamily;
			for (let y = 0; y < rows; y += 1) {
				for (let x = 0; x < cols; x += 1) {
					const i = y * cols + x;
					const v = heat[i];
					const px = x * CELL;
					const py = y * CELL;
					ctx.strokeStyle = "#ffffff0a";
					ctx.strokeRect(px + 1, py + 1, CELL - 2, CELL - 2);
					if (v > 0.02) {
						const a = Math.min(0.85, v);
						const color = tint[i] === 2 ? "227,77,89" : tint[i] === 1 ? "230,162,60" : "255,255,255";
						ctx.fillStyle = `rgba(${color},${a * 0.16})`;
						ctx.fillRect(px + 1, py + 1, CELL - 2, CELL - 2);
						ctx.strokeStyle = `rgba(${color},${a * 0.55})`;
						ctx.strokeRect(px + 1, py + 1, CELL - 2, CELL - 2);
						if (v > 0.5) {
							ctx.fillStyle = `rgba(${color},${a * 0.8})`;
							const g = glyphs[Math.floor(Math.random() * glyphs.length)];
							ctx.fillText(g, px + CELL / 2 - 3, py + CELL / 2 + 4);
						}
						heat[i] = v * 0.965;
					}
				}
			}
		},
	};
}

/* ---------- A 字符雨：低密度蓝色字符瀑布 ---------- */
function matrixFactory() {
	const { w, h } = sizeCanvas();
	const FONT = 13;
	const cols = Math.ceil(w / FONT);
	const drops = Array.from({ length: cols }, () => Math.random() * -60);
	const speeds = Array.from({ length: cols }, () => 0.4 + Math.random() * 0.8);
	const chars = "ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﬀ0123456789ABCDEF<>{}[]#$%";
	ctx.fillStyle = "#0b0f14";
	ctx.fillRect(0, 0, w, h);
	return {
		step() {
			ctx.fillStyle = "#0b0f1414";
			ctx.fillRect(0, 0, w, h);
			ctx.font = FONT + "px " + getComputedStyle(document.body).fontFamily;
			for (let x = 0; x < cols; x += 1) {
				const y = drops[x] * FONT;
				if (y > 0) {
					const c = chars[Math.floor(Math.random() * chars.length)];
					ctx.fillStyle = y % 7 < 1 ? "#dff3ff" : "#3b82c4aa";
					ctx.fillText(c, x * FONT, y);
				}
				drops[x] += speeds[x];
				if (y > h && Math.random() < 0.02) drops[x] = Math.random() * -40;
			}
		},
	};
}

/* ---------- C 粒子网络：漂浮点 + 邻近连线 ---------- */
function particlesFactory() {
	const { w, h } = sizeCanvas();
	const N = Math.min(90, Math.floor((w * h) / 16000));
	const pts = Array.from({ length: N }, () => ({
		x: Math.random() * w,
		y: Math.random() * h,
		vx: (Math.random() - 0.5) * 0.35,
		vy: (Math.random() - 0.5) * 0.35,
	}));
	return {
		step() {
			ctx.clearRect(0, 0, w, h);
			for (const p of pts) {
				p.x += p.vx; p.y += p.vy;
				if (p.x < 0 || p.x > w) p.vx *= -1;
				if (p.y < 0 || p.y > h) p.vy *= -1;
			}
			ctx.lineWidth = 1;
			for (let i = 0; i < N; i += 1) {
				for (let j = i + 1; j < N; j += 1) {
					const dx = pts[i].x - pts[j].x;
					const dy = pts[i].y - pts[j].y;
					const d2 = dx * dx + dy * dy;
					if (d2 < 15000) {
						ctx.strokeStyle = `rgba(64,158,255,${0.14 * (1 - d2 / 15000)})`;
						ctx.beginPath();
						ctx.moveTo(pts[i].x, pts[i].y);
						ctx.lineTo(pts[j].x, pts[j].y);
						ctx.stroke();
					}
				}
			}
			for (const p of pts) {
				ctx.fillStyle = "#409eff88";
				ctx.beginPath();
				ctx.arc(p.x, p.y, 1.6, 0, Math.PI * 2);
				ctx.fill();
			}
		},
	};
}

/* ---------- D 雷达扫描：同心环 + 旋转亮扫 + 目标点 ---------- */
function radarFactory() {
	const { w, h } = sizeCanvas();
	const targets = Array.from({ length: 7 }, () => ({
		a: Math.random() * Math.PI * 2,
		r: 0.2 + Math.random() * 0.75,
		heat: 0,
	}));
	let angle = 0;
	return {
		step() {
			ctx.clearRect(0, 0, w, h);
			const cx = w * 0.5;
			const cy = h * 0.48;
			const R = Math.min(w, h) * 0.42;
			ctx.strokeStyle = "#409eff22";
			ctx.lineWidth = 1;
			for (let k = 1; k <= 4; k += 1) {
				ctx.beginPath();
				ctx.arc(cx, cy, (R * k) / 4, 0, Math.PI * 2);
				ctx.stroke();
			}
			ctx.beginPath();
			ctx.moveTo(cx - R, cy); ctx.lineTo(cx + R, cy);
			ctx.moveTo(cx, cy - R); ctx.lineTo(cx, cy + R);
			ctx.stroke();
			// The sweep: a fading wedge behind the leading edge.
			angle += 0.012;
			for (let k = 0; k < 30; k += 1) {
				const a = angle - k * 0.02;
				ctx.strokeStyle = `rgba(64,158,255,${0.10 * (1 - k / 30)})`;
				ctx.beginPath();
				ctx.moveTo(cx, cy);
				ctx.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R);
				ctx.stroke();
			}
			for (const t of targets) {
				const ta = t.a;
				const diff = Math.abs(((angle - ta) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2));
				if (diff < 0.35) t.heat = 1;
				t.heat *= 0.985;
				const x = cx + Math.cos(ta) * R * t.r;
				const y = cy + Math.sin(ta) * R * t.r;
				ctx.fillStyle = `rgba(227,77,89,${0.25 + t.heat * 0.7})`;
				ctx.beginPath();
				ctx.arc(x, y, 3 + t.heat * 2, 0, Math.PI * 2);
				ctx.fill();
			}
		},
	};
}

/* ---------- G 终端日志：轮播的假扫描输出 ---------- */
const TERM_LINES = [
	["dim", "$ sentinel --target 10.10.10.0/24 --scope authorized"],
	["ok", "[+] host 10.10.10.5      up  (linux, nginx 1.24)"],
	["ok", "[+] port 22/tcp           openssh 9.6"],
	["warn", "[!] port 8080/tcp        未授权访问 /actuator/env"],
	["ok", "[+] port 3306/tcp         mysql 8.0（仅内网）"],
	["dim", "$ nuclei -l targets.txt -severity medium,high,critical"],
	["warn", "[!] sql-injection         POST /admin/login  user 参数"],
	["ok", "[+] 已提交漏洞中枢：后台登录处 SQL 注入"],
	["dim", "$ vuln_list --status pending"],
	["ok", "[+] 42 条待确认 · 评审模型已校准等级"],
];
function termFactory() {
	const layer = document.getElementById("layer-term");
	layer.style.display = "block";
	layer.innerHTML = "";
	let line = 0;
	let column = 0;
	let last = "";
	const caret = document.createElement("span");
	caret.className = "caret";
	return {
		step() {
			if (line >= TERM_LINES.length) {
				if (Math.random() < 0.06) {
					line = 0;
					layer.innerHTML = "";
				}
				return;
			}
			const [cls, text] = TERM_LINES[line];
			if (column === 0) {
				last = document.createElement("div");
				last.className = "ln " + cls;
				layer.appendChild(last);
				layer.appendChild(caret);
			}
			column += 1;
			last.textContent = text.slice(0, column);
			if (column >= text.length) {
				line += 1;
				column = 0;
			}
		},
		stop() {
			layer.style.display = "none";
		},
	};
}

/* ---------- F 极光呼吸：纯 CSS，这里只负责开关 ---------- */
function auroraFactory() {
	const layer = document.getElementById("layer-aurora");
	layer.style.display = "block";
	return {
		step() {},
		stop() {
			layer.style.display = "none";
		},
	};
}

const DESCRIPTIONS = {
	tiles: "B 网格脉冲 — 呼应你给参考图气质：暗色瓦片网格，随机点亮后衰减，偶尔琥珀/红高亮。安静、克制的「扫描感」。CPU 低。",
	matrix: "A 字符雨 — 经典 Matrix 瀑布，低密度蓝色，稀疏白色高亮。氛围最「黑客」，但最常见。",
	particles: "C 粒子网络 — 漂浮节点邻近连线，科技感通用款。安静，CPU 中低。",
	radar: "D 雷达扫描 — 同心环 + 旋转扫掠 + 红色目标点亮起，渗透/侦察隐喻最直白，和守门/漏洞主题呼应。CPU 低。",
	term: "G 终端日志 — 打字机轮播假扫描输出（nmap/nuclei/漏洞中枢），最贴产品身份，像系统活着。CPU 最低。",
	aurora: "F 极光呼吸 — 三团渐变色斑缓慢漂移，纯 CSS 无 canvas，零 CPU；最柔，科技感最弱。",
};

const FACTORIES = {
	tiles: tilesFactory,
	matrix: matrixFactory,
	particles: particlesFactory,
	radar: radarFactory,
	term: termFactory,
	aurora: auroraFactory,
};
let active = null;
let termTimer = 0;

function start(name) {
	if (active && active.stop) active.stop();
	cancelAnimationFrame(raf);
	current = name;
	document.querySelectorAll(".switcher button").forEach((b) => b.classList.toggle("on", b.dataset.v === name));
	document.getElementById("desc").textContent = DESCRIPTIONS[name];
	const factory = FACTORIES[name]();
	active = factory;
	const loop = () => {
		if (current !== name) return;
		factory.step();
		requestAnimationFrame(loop);
	};
	// The terminal types by character, so it runs on its own timer.
	if (name === "term") {
		termTimer = setInterval(() => {
			if (current !== "term") {
				clearInterval(termTimer);
				return;
			}
			factory.step();
		}, 45);
	} else {
		loop();
	}
}

window.addEventListener("resize", () => start(current));
document.getElementById("switcher").addEventListener("click", (event) => {
	const button = event.target.closest("button[data-v]");
	if (button) start(button.dataset.v);
});
start("tiles");
</script>
</body>
</html>
