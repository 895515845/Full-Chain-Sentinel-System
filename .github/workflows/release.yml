name: Release

# Publishes the two supported console binaries and the DroidBridge APK:
#
#   sentinel-web-linux-x64.tar.gz      Linux x86_64
#   sentinel-web-darwin-arm64.tar.gz   macOS arm64
#   sentinel-droidbridge-<版本>-debug.apk
#
# The binaries come from scripts/build-web-binaries.sh (Bun single-file compile,
# its default platform set is exactly these two). The APK is a debug build: the
# project has no signing config, so a release build would be unsigned and
# uninstallable. No repository secrets are required, the debug keystore is
# generated by the Android build itself and the release uses GITHUB_TOKEN.
#
# Each binary is compiled on its own native runner. Bun can cross-compile, but
# compiling natively avoids depending on that and lets the smoke test run the
# real artifact.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.0
        required: true
        type: string
      prerelease:
        description: Publish as a pre-release
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  BUN_VERSION: 1.3.14
  GRADLE_VERSION: 8.7

jobs:
  binary:
    name: Console binary (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            arch: x86_64
          - platform: darwin-arm64
            runner: macos-latest
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # macOS runners have been both architectures over time. The published
      # binary has to be arm64, so fail here instead of shipping the wrong one.
      - name: Verify runner architecture
        run: |
          set -euo pipefail
          actual="$(uname -m)"
          echo "runner architecture: $actual"
          test "$actual" = "${{ matrix.arch }}"

      # The native image dependencies the monorepo build links against. Only the
      # Linux runner needs them; the macOS runner uses prebuilt binaries.
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s "$(command -v fdfind)" /usr/local/bin/fd

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Refresh the pinned catalog so the released binary ships the models that
      # are current at release time. packages/ai/src/providers/data/ is tracked,
      # so this step is about freshness, not about filling in missing files.
      - name: Refresh model data
        run: npm run hydrate:model-data

      - name: Build the console binary
        run: bash scripts/build-web-binaries.sh --platform "${{ matrix.platform }}" --out "$RUNNER_TEMP/binaries"

      - name: Smoke test the binary
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/binaries/${{ matrix.platform }}/sentinel-web" --version

      - name: Upload the archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sentinel-web-${{ matrix.platform }}
          path: ${{ runner.temp }}/binaries/sentinel-web-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  apk:
    name: DroidBridge APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The local script in scripts/ is macOS-only (it fetches macOS build-tools
      # and expects a JDK under /Library/Java). On Linux the SDK comes from the
      # runner image and only the missing packages are installed.
      - name: Install JDK 17
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk-headless

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          sdkmanager="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platforms;android-34" "build-tools;34.0.0"
          # Pin the SDK for the Gradle build instead of relying on whatever the
          # runner image happens to export.
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"

      # The project has no Gradle wrapper, so the pinned distribution is fetched
      # and checked against the checksum Gradle publishes next to it.
      - name: Install Gradle
        run: |
          set -euo pipefail
          url="https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          curl -fsSLo "$RUNNER_TEMP/gradle.zip" "$url"
          curl -fsSLo "$RUNNER_TEMP/gradle.zip.sha256" "$url.sha256"
          (cd "$RUNNER_TEMP" && echo "$(cat gradle.zip.sha256)  gradle.zip" | sha256sum -c -)
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP/gradle"
          echo "$RUNNER_TEMP/gradle/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Build the debug APK
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: gradle -p packages/droid-apk --no-daemon assembleDebug

      - name: Upload the APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sentinel-droidbridge
          path: packages/droid-apk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish the release
    needs:
      - binary
      - apk
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      # Needed to read the APK's versionName out of the Gradle file below.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets

      - name: Collect and validate the assets
        run: |
          set -euo pipefail
          mkdir -p publish
          # The APK keeps the version the app itself reports, so the file name
          # matches `dumpsys package com.sentinel.droidbridge`.
          version="$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' packages/droid-apk/app/build.gradle.kts | head -1)"
          test -n "$version"
          cp release-assets/sentinel-web-linux-x64/sentinel-web-linux-x64.tar.gz publish/
          cp release-assets/sentinel-web-darwin-arm64/sentinel-web-darwin-arm64.tar.gz publish/
          cp release-assets/sentinel-droidbridge/app-debug.apk "publish/sentinel-droidbridge-${version}-debug.apk"
          ls -l publish
          test "$(find publish -type f | wc -l)" -eq 3

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" publish/* --clobber
          elif [ "${PRERELEASE:-false}" = "true" ]; then
            gh release create "$RELEASE_TAG" publish/* \
              --title "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --prerelease
          else
            gh release create "$RELEASE_TAG" publish/* \
              --title "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --generate-notes
          fi
