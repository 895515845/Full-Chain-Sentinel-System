name: iOS package repo

on:
  push:
    paths:
      - "docs/repo/**"
      - ".github/workflows/ios-repo.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-repo-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Publish to the lowercase Pages repo
        env:
          PAGES_REPO_TOKEN: ${{ secrets.PAGES_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PAGES_REPO_TOKEN}" ]; then
            echo "::error::缺少 PAGES_REPO_TOKEN。请在 main 仓库 Secrets 中添加一个可写 zgsfsec/sentinel-ios-repo 的 PAT。"
            exit 1
          fi
          cd docs/repo
          git init -b main
          git config user.name "sentinel-repo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有变更"
            exit 0
          fi
          git commit -m "Publish iOS Sileo repo $(date -u +%FT%TZ)"
          git remote add origin "https://x-access-token:${PAGES_REPO_TOKEN}@github.com/zgsfsec/sentinel-ios-repo.git"
          git push --force origin main
